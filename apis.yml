aid: prana-health
name: Prana Health
description: >-
  Prana (prana.health) is a research-driven body-enhancement company building a
  system to engineer more muscle and less fat through three integrated steps:
  performance testing to measure a user's biology, predictive body-composition
  models that adapt training and nutrition protocols in real time, and
  personalized enhancement medicine to accelerate results safely. The platform
  centers on proprietary body-modeling technology, including its MUSCLE-1
  hypertrophy prediction model, and is currently offered to users through a beta
  program. As of this profile Prana publishes a consumer marketing and research
  site only and exposes no public developer API, documentation, or SDKs.
